<!DOCTYPE html>
<html lang="fr">
<meta charset="utf-8">
<title>First stack</title>
<h1>web + api + db</h1>
<button onclick="ping()">Interroger l'API</button>
<pre id="out">...</pre>
<script>
  async function ping() {
    const r = await fetch('/api');
    document.getElementById('out').textContent = await r.text();
  }
</script>
